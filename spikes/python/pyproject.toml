[project]
name = "tt-spike"
version = "0.0.0"
description = "A small task tracker: an action framework over SQLite, a CLI and a TUI, in Python."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.60",
]

[project.scripts]
tt-cli = "tt.frontend.cli:main"
tt-tui = "tt.frontend.tui:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "basedpyright>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tt"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["tt"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]

[package]
name = "tt-spike"
version = "0.1.0"
edition = "2024"

# The domain core still names almost none of this. `platform/action.rs` names
# only `sea_orm::DatabaseTransaction` — the one type its `execute` is handed to
# write through — and the domain objects mention only serde's derives.
# Everything else is reached through one module each: `platform/wire.rs` for
# JSON, `platform/db.rs` plus each domain's `services.rs` for SQL, and
# `frontend/` for the two frontends. The tree is what a real application costs,
# not what an action costs.
[dependencies]
chrono = "0.4"
clap = { version = "4.5", features = ["env", "string"] }
crossterm = "0.29"
ratatui = "0.29"
schemars = "1.2.2"
sea-orm = { version = "1.1", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
] }
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order` is load-bearing rather than a preference: without it
# `serde_json::Map` is a `BTreeMap`, the properties of a derived schema come
# back alphabetically, and `form::of_schema` renders fields in an order the
# payload type never declared.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

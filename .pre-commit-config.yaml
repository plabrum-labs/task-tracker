default_install_hook_types: [pre-commit, pre-push]

# Every hook shells out to a justfile recipe rather than pinning its own
# binary, so the hook, CI and a manual `just verify` can never run different
# versions of the same tool.
repos:
  - repo: local
    hooks:
      - id: format
        name: just format
        entry: just format
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - id: lint
        name: just lint
        entry: just lint
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      # The test suite is the slow part, so it gates the push rather than every
      # commit. always_run because a push carries commits this hook has not
      # seen, whatever the working tree happens to touch.
      - id: verify
        name: just verify
        entry: just verify
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

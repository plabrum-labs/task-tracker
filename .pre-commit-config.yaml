default_install_hook_types: [pre-commit]

# Every hook shells out to a justfile recipe rather than pinning its own
# binary, so the hook, CI and a manual `just verify` can never run different
# versions of the same tool.
repos:
  - repo: local
    hooks:
      - id: format
        name: just format
        entry: just format
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - id: lint
        name: just lint
        entry: just lint
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      # The test suite is the slow part and runs in CI on pull request (see
      # .github/workflows/ci.yml), not on commit, so nothing slow gates a local
      # commit.

default_install_hook_types: [pre-commit]

# Every hook shells out to a justfile recipe rather than pinning its own
# binary, so the hook, CI and a manual `just verify` can never run different
# versions of the same tool.
repos:
  - repo: local
    hooks:
      - id: format
        name: just format
        entry: just format
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - id: lint
        name: just lint
        entry: just lint
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      # The test suite is the slow part; it gates every commit rather than the
      # push, so nothing slow runs at push time. always_run because a commit's
      # correctness does not depend on which files the working tree touches.
      - id: test
        name: just test
        entry: just test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

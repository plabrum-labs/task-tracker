[project]
name = "tt"
version = "0.0.0"
description = "A small task tracker: an action framework over SQLite, a CLI and a TUI, in Python."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.60",
    "tomli-w>=1.0",
]

[project.scripts]
tt = "tt.frontend.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "basedpyright>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tt"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["tt", "tests"]
target-version = "py312"
line-length = 100
# Throwaway TUI prototype kept for reference; superseded by tt/frontend/tui.py.
# Excluded from lint until it is promoted into tt or removed.
extend-exclude = ["tui_spike.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["tt"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["tt", "tests"]
